    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
        }
        .dark .glass-header {
            background: rgba(15, 23, 42, 0.92);
        }

        /* Card Stack Animation Styles */
        .card-stack-container {
            height: 60vh;
            max-height: 480px;
            position: relative;
            perspective: 1000px;
        }

        .stack-card {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease, box-shadow 0.3s ease;
            transform-origin: center bottom;
            will-change: transform, opacity;
        }

        /* Position 0: Active top card */
        .stack-card[data-depth="0"] {
            transform: translateY(0) scale(1);
            z-index: 30;
            opacity: 1;
            box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.12), 0 4px 12px -2px rgba(0, 0, 0, 0.08);
        }

        /* Position 1: Second card stacked behind */
        .stack-card[data-depth="1"] {
            transform: translateY(14px) scale(0.95);
            z-index: 20;
            opacity: 0.92;
            pointer-events: none;
        }

        /* Position 2: Third card stacked deep behind */
        .stack-card[data-depth="2"] {
            transform: translateY(28px) scale(0.90);
            z-index: 10;
            opacity: 0.75;
            pointer-events: none;
        }

        /* Hidden cards further back */
        .stack-card[data-depth="hidden"] {
            transform: translateY(40px) scale(0.85);
            z-index: 0;
            opacity: 0;
            pointer-events: none;
        }

        /* Swiping out animation */
        .stack-card.card-exit-to-back {
            animation: moveCardToBack 0.45s ease-in-out forwards;
        }

        @keyframes moveCardToBack {
            0% {
                transform: translateY(0) scale(1) rotate(0deg);
                opacity: 1;
                z-index: 35;
            }
            40% {
                transform: translateY(-70px) scale(0.96) rotate(-3deg);
                opacity: 0.8;
                z-index: 35;
            }
            100% {
                transform: translateY(30px) scale(0.88) rotate(0deg);
                opacity: 0.5;
                z-index: 5;
            }
        }

        /* iOS Wheel Picker Styles */
        .ios-wheel-container {
            height: 140px;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            position: relative;
            mask-image: linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
        }
        .ios-wheel-item {
            height: 40px;
            scroll-snap-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ios-wheel-highlight {
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            height: 40px;
            background: rgba(99, 102, 241, 0.12);
            border-top: 1px solid rgba(99, 102, 241, 0.3);
            border-bottom: 1px solid rgba(99, 102, 241, 0.3);
            pointer-events: none;
            border-radius: 8px;
        }
    </style>
</head>

        function IOSWheelPicker({ items, selectedValue, onChange, label }) {
            const containerRef = useRef(null);

            const handleScroll = (e) => {
                const scrollTop = e.target.scrollTop;
                const index = Math.round(scrollTop / 40);
                if (items[index] !== undefined && items[index] !== selectedValue) {
                    onChange(items[index]);
                }
            };

            useEffect(() => {
                if (containerRef.current) {
                    const idx = items.indexOf(selectedValue);
                    if (idx !== -1) {
                        containerRef.current.scrollTop = idx * 40;
                    }
                }
            }, [selectedValue]);

            return (
                <div className="flex flex-col items-center flex-1">
                    {label && <span className="text-[11px] font-bold text-slate-400 mb-1">{label}</span>}
                    <div className="relative w-full">
                        <div className="ios-wheel-highlight"></div>
                        <div 
                            ref={containerRef}
                            onScroll={handleScroll}
                            className="ios-wheel-container border border-slate-200/80 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900/60">
                            <div className="h-[50px]"></div>
                            {items.map((item, idx) => (
                                <div 
                                    key={idx}
                                    onClick={() => {
                                        onChange(item);
                                        if (containerRef.current) containerRef.current.scrollTop = idx * 40;
                                    }}
                                    className={`ios-wheel-item ${item === selectedValue ? 'text-indigo-600 dark:text-indigo-400 font-extrabold text-base scale-105' : 'text-slate-500 dark:text-slate-400 opacity-60'}`}>
                                    {item}
                                </div>
                            ))}
                            <div className="h-[50px]"></div>
                        </div>
                    </div>
                </div>
            );
        }

                if (!text) return;
                const dummy = document.createElement('textarea');
                document.body.appendChild(dummy);
                dummy.value = text.replace(/\s+/g, '');
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);

                        <button 
                            onClick={() => setCurrentTab('dashboard')}
                            className={`flex flex-col items-center justify-center w-12 h-12 transition-all ${currentTab === 'dashboard' ? 'text-indigo-600 dark:text-indigo-400 font-extrabold' : 'text-slate-400'}`}>
                            <i data-lucide="home" className="w-5 h-5"></i>
                            <span className="text-[10px] mt-0.5">خانه</span>
                        </button>

                        <button 
                            onClick={() => setCurrentTab('accounts')}
                            className={`flex flex-col items-center justify-center w-12 h-12 transition-all ${currentTab === 'accounts' ? 'text-indigo-600 dark:text-indigo-400 font-extrabold' : 'text-slate-400'}`}>
                            <i data-lucide="wallet" className="w-5 h-5"></i>
                            <span className="text-[10px] mt-0.5">حساب‌ها</span>
                        </button>

                        {/* Plus Button */}
                        <button 
                            onClick={() => setShowPlusMenu(true)}
                            className="w-12 h-12 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full flex items-center justify-center shadow-lg -mt-5 active:scale-90 transition-transform">
                            <i data-lucide="plus" className="w-6 h-6"></i>
                        </button>

                        <button 
                            onClick={() => setCurrentTab('contacts')}
                            className={`flex flex-col items-center justify-center w-12 h-12 transition-all ${currentTab === 'contacts' ? 'text-indigo-600 dark:text-indigo-400 font-extrabold' : 'text-slate-400'}`}>
                            <i data-lucide="users" className="w-5 h-5"></i>
                            <span className="text-[10px] mt-0.5">مخاطبین</span>
                        </button>

                        <button 
                            onClick={() => setCurrentTab('settings')}
                            className={`flex flex-col items-center justify-center w-12 h-12 transition-all ${currentTab === 'settings' ? 'text-indigo-600 dark:text-indigo-400 font-extrabold' : 'text-slate-400'}`}>
                            <i data-lucide="settings" className="w-5 h-5"></i>
                            <span className="text-[10px] mt-0.5">تنظیمات</span>
                        </button>
                    </div>

                    {/* Plus Menu Modal */}
                    {showPlusMenu && (
                        <div className="absolute inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-end justify-center animate-fade-in">
                            <div className="w-full bg-white dark:bg-slate-900 rounded-t-[32px] p-5 pb-8 space-y-3 border-t border-slate-100 dark:border-slate-800 shadow-2xl animate-slide-up">
                                <div className="w-10 h-1 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mb-2"></div>
                                <h3 className="text-center font-extrabold text-slate-900 dark:text-white text-base mb-4">ثبت جدید</h3>

                                <button 
                                    onClick={() => { setShowPlusMenu(false); setShowAddContactModal(true); }}
                                    className="w-full bg-slate-50 dark:bg-slate-800/80 p-3.5 rounded-2xl flex items-center space-x-4 space-x-reverse border border-slate-100 dark:border-slate-700">
                                    <div className="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-950 text-blue-600 flex items-center justify-center">
                                        <i data-lucide="user-plus" className="w-5 h-5"></i>
                                    </div>
                                    <span className="font-bold text-xs text-slate-800 dark:text-slate-100">مخاطب جدید</span>
                                </button>

                                <button 
                                    onClick={() => openStackWizard('demand', 'add')}
                                    className="w-full bg-slate-50 dark:bg-slate-800/80 p-3.5 rounded-2xl flex items-center space-x-4 space-x-reverse border border-slate-100 dark:border-slate-700">
                                    <div className="w-10 h-10 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-600 flex items-center justify-center">
                                        <i data-lucide="arrow-up-right" className="w-5 h-5"></i>
                                    </div>
                                    <span className="font-bold text-xs text-slate-800 dark:text-slate-100">ثبت طلب</span>
                                </button>

                                <button 
                                    onClick={() => openStackWizard('debt', 'add')}
                                    className="w-full bg-slate-50 dark:bg-slate-800/80 p-3.5 rounded-2xl flex items-center space-x-4 space-x-reverse border border-slate-100 dark:border-slate-700">
                                    <div className="w-10 h-10 rounded-full bg-red-100 dark:bg-red-950 text-red-500 flex items-center justify-center">
                                        <i data-lucide="arrow-down-left" className="w-5 h-5"></i>
                                    </div>
                                    <span className="font-bold text-xs text-slate-800 dark:text-slate-100">ثبت بدهی</span>
                                </button>

                                <button 
                                    onClick={() => openStackWizard('loan', 'add')}
                                    className="w-full bg-slate-50 dark:bg-slate-800/80 p-3.5 rounded-2xl flex items-center space-x-4 space-x-reverse border border-slate-100 dark:border-slate-700">
                                    <div className="w-10 h-10 rounded-full bg-indigo-100 dark:bg-indigo-950 text-indigo-600 flex items-center justify-center">
                                        <i data-lucide="landmark" className="w-5 h-5"></i>
                                    </div>
                                    <span className="font-bold text-xs text-slate-800 dark:text-slate-100">ثبت وام</span>
                                </button>

                                <button onClick={() => setShowPlusMenu(false)} className="w-full py-2.5 text-center font-bold text-xs text-slate-400">
                                    انصراف
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Stack Wizard Modal (وام، طلب، قرض، قسط) */}
                    {showStackWizard && (
                        <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex flex-col justify-start p-4 pt-5 animate-fade-in overflow-hidden">
                            <div className="flex justify-between items-center mb-3 text-white">
                                <h3 className="font-extrabold text-sm">
                                    {wizardType === 'loan' && (wizardMode === 'edit' ? 'ویرایش کارت‌های وام' : 'ثبت کارت‌های پرونده وام')}
                                    {wizardType === 'demand' && (wizardMode === 'edit' ? 'ویرایش طلب' : 'ثبت کارت‌های طلب')}
                                    {wizardType === 'debt' && (wizardMode === 'edit' ? 'ویرایش قرض / بدهی' : 'ثبت کارت‌های قرض / بدهی')}
                                    {wizardType === 'installment' && 'ثبت قسط جدید'}
                                </h3>
                                <button onClick={() => setShowStackWizard(false)} className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center">
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>
                            </div>

                            <div className="card-stack-container w-full">
                                {activeCards.map((card, index) => {
                                    const depth = index - currentCardIdx;
                                    let depthAttr = 'hidden';
                                    if (depth === 0) depthAttr = '0';
                                    else if (depth === 1) depthAttr = '1';
                                    else if (depth === 2) depthAttr = '2';

                                    if (depth < 0) return null;

                                    return (
                                        <div 
                                            key={card.id}
                                            data-depth={depthAttr}
                                            className={`stack-card bg-white dark:bg-slate-800 rounded-3xl p-4 border border-slate-100 dark:border-slate-700 flex flex-col justify-between ${
                                                depth === 0 && animatingCard ? 'card-exit-to-back' : ''
                                            }`}>
                                            
                                            <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-700/60 pb-2">
                                                <span className="text-xs font-extrabold text-indigo-600 dark:text-indigo-400">
                                                    {card.title}
                                                </span>
                                                <button 
                                                    type="button"
                                                    onClick={() => handleNextCard(activeCards)}
                                                    className="text-[11px] font-bold text-slate-400 bg-slate-100 dark:bg-slate-700/60 px-2.5 py-1 rounded-full">
                                                    رد شدن
                                                </button>
                                            </div>

                                            <div className="flex-1 py-2 overflow-y-auto hide-scrollbar">
                                                {card.render()}
                                            </div>

                                            <div className="pt-2 border-t border-slate-100 dark:border-slate-700/60">
                                                <button 
                                                    type="button"
                                                    onClick={() => handleNextCard(activeCards)}
                                                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md">
                                                    {index === activeCards.length - 1 ? 'ثبت و ذخیره نهایی' : 'مرحله بعدی'}
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="flex justify-center items-center space-x-1.5 space-x-reverse mt-3">
                                {activeCards.map((_, i) => (
                                    <div 
                                        key={i} 
                                        className={`h-1.5 rounded-full transition-all ${
                                            i === currentCardIdx ? 'w-6 bg-indigo-500' : 'w-1.5 bg-slate-400/40'
                                        }`}
                                    />
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Export Modal */}
                    {showExportModal && (
                        <div className="absolute inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-end justify-center animate-fade-in">
                            <div className="w-full bg-white dark:bg-slate-900 rounded-t-[32px] p-5 pb-8 space-y-4 border-t border-slate-100 dark:border-slate-800 shadow-2xl">
                                <div className="w-10 h-1 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto"></div>
                                <div className="text-center">
                                    <h3 className="font-extrabold text-slate-900 dark:text-white text-base">خروجی پرونده</h3>
                                    <p className="text-xs text-slate-400 mt-1">فرمت مورد نظر را انتخاب نمایید</p>
                                </div>

                                <div className="space-y-2.5">
                                    <button onClick={() => { setShowExportModal(false); showToast('فایل Excel دانلود شد'); }} className="w-full bg-slate-50 dark:bg-slate-800 p-3.5 rounded-2xl flex items-center space-x-3 space-x-reverse border border-slate-100 dark:border-slate-700">
                                        <div className="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-700 font-bold text-xs flex items-center justify-center">XLS</div>
                                        <span className="font-bold text-xs">Excel</span>
                                    </button>
                                    <button onClick={() => { setShowExportModal(false); showToast('فایل PDF دانلود شد'); }} className="w-full bg-slate-50 dark:bg-slate-800 p-3.5 rounded-2xl flex items-center space-x-3 space-x-reverse border border-slate-100 dark:border-slate-700">
                                        <div className="w-8 h-8 rounded-lg bg-red-100 text-red-600 font-bold text-xs flex items-center justify-center">PDF</div>
                                        <span className="font-bold text-xs">PDF</span>
                                    </button>
                                </div>
                                <button onClick={() => setShowExportModal(false)} className="w-full py-2 text-center font-bold text-xs text-slate-400">انصراف</button>
                            </div>
                        </div>
                    )}

                    {/* Modal: Add New Contact */}
                    {showAddContactModal && (
                        <div className="absolute inset-0 bg-black/50 z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white dark:bg-slate-800 w-full rounded-3xl p-5 space-y-3">
                                <h3 className="text-sm font-bold text-slate-900 dark:text-white">افزودن مخاطب جدید</h3>
                                <input 
                                    type="text" 
                                    placeholder="نام" 
                                    value={newContactForm.firstName} 
                                    onChange={(e) => setNewContactForm({...newContactForm, firstName: e.target.value})}
                                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs" 
                                />
                                <input 
                                    type="text" 
                                    placeholder="نام خانوادگی" 
                                    value={newContactForm.lastName} 
                                    onChange={(e) => setNewContactForm({...newContactForm, lastName: e.target.value})}
                                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs" 
                                />
                                <input 
                                    type="text" 
                                    placeholder="شماره تماس" 
                                    value={newContactForm.phone} 
                                    onChange={(e) => setNewContactForm({...newContactForm, phone: e.target.value})}
                                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs" 
                                />
                                <input 
                                    type="text" 
                                    placeholder="شماره کارت (اختیاری)" 
                                    value={newContactForm.bankCard} 
                                    onChange={(e) => setNewContactForm({...newContactForm, bankCard: e.target.value})}
                                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs" 
                                />
                                <input 
                                    type="text" 
                                    placeholder="شماره شبا (اختیاری)" 
                                    value={newContactForm.iban} 
                                    onChange={(e) => setNewContactForm({...newContactForm, iban: e.target.value})}
                                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs" 
                                />
                                <div className="flex space-x-2 space-x-reverse pt-2">
                                    <button onClick={handleCreateContact} className="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">ذخیره</button>
                                    <button onClick={() => setShowAddContactModal(false)} className="flex-1 bg-slate-100 dark:bg-slate-700 py-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300">انصراف</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal: Edit Contact */}
                    {showEditContactModal && (
                        <div className="absolute inset-0 bg-black/50 z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white dark:bg-slate-800 w-full rounded-3xl p-5 space-y-3">
                                <h3 className="text-sm font-bold text-slate-900 dark:text-white">ویرایش اطلاعات مخاطب</h3>
                                <input 
                                    type="text" 
                                    placeholder="نام" 
                                    value={editContactForm.firstName} 
                                    onChange={(e) => setEditContactForm({...editContactForm, firstName: e.target.value})}
                                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs" 
                                />
                                <input 
                                    type="text" 
                                    placeholder="نام خانوادگی" 
                                    value={editContactForm.lastName} 
                                    onChange={(e) => setEditContactForm({...editContactForm, lastName: e.target.value})}
                                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs" 
                                />
                                <input 
                                    type="text" 
                                    placeholder="شماره تماس" 
                                    value={editContactForm.phone} 
                                    onChange={(e) => setEditContactForm({...editContactForm, phone: e.target.value})}
                                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs" 
                                />
                                <input 
                                    type="text" 
                                    placeholder="شماره کارت" 
                                    value={editContactForm.bankCard} 
                                    onChange={(e) => setEditContactForm({...editContactForm, bankCard: e.target.value})}
                                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs" 
                                />
                                <input 
                                    type="text" 
                                    placeholder="شماره شبا" 
                                    value={editContactForm.iban} 
                                    onChange={(e) => setEditContactForm({...editContactForm, iban: e.target.value})}
                                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs" 
                                />
                                <div className="flex space-x-2 space-x-reverse pt-2">
                                    <button onClick={handleUpdateContact} className="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">به‌روزرسانی</button>
                                    <button onClick={() => setShowEditContactModal(false)} className="flex-1 bg-slate-100 dark:bg-slate-700 py-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300">انصراف</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
